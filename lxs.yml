name: auth-ui
domain: auth
version: 3.1.0
publisher: stuff8
status: unverified
license: mit
summary: "White-label signin, signup, and password recovery pages for the auth domain (Leptos SSR)"

targets:
  - linux/amd64
  - darwin/arm64

artifacts: {}

contract:
  version: 1
  api: "auth-ui pages: GET /signin, GET /signup, GET /forgot-password, GET /reset-password"
  env:
    required:
      - SERVER_PORT
    optional:
      - AUTH_API_BASE
      - AUTH_REDIRECT_URL
  db: "none"
  network:
    inbound: [http]
    outbound: [http]
  resources:
    memory: "32m"
    disk: "32m"
    startup_seconds: 5

runtime:
  base: self-contained-static
  libc: musl
  dependencies: []

provenance:
  source: https://github.com/getecosphere/auth-ui.git
  commit: ""
  built_by: ""
  built_at: ""
  target: x86_64-unknown-linux-musl

release: []

compose:
  service:
    name: auth-ui
    port: 4201
    access:
      routes:
        - { path: /signin, level: public }
        - { path: /signup, level: public }
        - { path: /forgot-password, level: public }
        - { path: /reset-password, level: public }
        - { path: /verify-email, level: public }
        - { path: /static/auth-ui.css, level: public }
